name: Build iOS/iPadOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS/iPadOS Application
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: List available schemes
      run: xcodebuild -list -project LLMFarm.xcodeproj
    
    - name: Build for iOS Simulator (iPhone)
      run: |
        xcodebuild clean build \
          -project LLMFarm.xcodeproj \
          -scheme LLMFarm_Release \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Build for iOS Simulator (iPad)
      run: |
        xcodebuild clean build \
          -project LLMFarm.xcodeproj \
          -scheme LLMFarm_Release \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Archive for iOS Device
      run: |
        xcodebuild archive \
          -project LLMFarm.xcodeproj \
          -scheme LLMFarm_Release \
          -sdk iphoneos \
          -configuration Release \
          -archivePath ${{ github.workspace }}/build/LLMFarm.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Export IPA (Optional)
      continue-on-error: true
      run: |
        # Create export options plist
        cat > ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
        </dict>
        </plist>
        EOF
        
        # Note: IPA export requires code signing credentials and will fail in CI
        # The xcarchive is still available and can be exported manually with proper credentials
        xcodebuild -exportArchive \
          -archivePath ${{ github.workspace }}/build/LLMFarm.xcarchive \
          -exportPath ${{ github.workspace }}/build/ipa \
          -exportOptionsPlist ExportOptions.plist
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LLMFarm-iOS-Build
        path: |
          build/LLMFarm.xcarchive
          build/ipa
        retention-days: 30
